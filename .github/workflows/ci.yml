name: CI - Quality and Security

on:
  pull_request:
    branches:
      - main
      - t3/migrar-nextjs-vercel-portfolio
  push:
    branches:
      - main
      - t3/migrar-nextjs-vercel-portfolio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting of changed files
        if: github.event_name != 'workflow_dispatch'
        run: npm run format:check:changed
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e -- --reporter=line,html --output=test-results/local
        env:
          TEST_NO_ACCOUNT_CONFIG: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/local

      - name: Build with mock account configuration
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://rendimentos-test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-test-key
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Account end-to-end tests with HTTP mocks
        run: npm run test:e2e -- tests/account.spec.ts --reporter=line,html --output=test-results/account
        env:
          TEST_ACCOUNT_AUTH: "1"
          TEST_CAPTCHA: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/account

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  sql:
    name: SQL migrations and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify migrations, isolation and rollback
        run: npm run test:sql

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit for high and critical vulnerabilities
        run: npm audit --audit-level=high
