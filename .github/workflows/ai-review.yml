name: AI Code Review (gratuito)

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisão IA informativa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      # For pull_request_target, github.sha is the trusted base/main revision.
      # Never use the PR head/merge ref in this privileged job.
      - name: Checkout trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      # No dependency installation, caches, PR scripts or artifacts in this job.
      - name: Review changes or report skip
        run: node scripts/ai-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
